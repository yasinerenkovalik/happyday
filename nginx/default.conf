# Bağlantı önizlemesi yapan uygulamalar (WhatsApp, Instagram/Facebook, X, Telegram...) JavaScript çalıştırmaz;
# mekan sayfasında boş index.html yerine API'nin hazırladığı başlık + açıklama + kapak görselli sayfayı alırlar.
# Google bu listede yok: JavaScript'i çalıştırıp asıl sayfayı okur.
map $http_user_agent $preview_bot {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|meta-externalagent|whatsapp|twitterbot|telegrambot|linkedinbot|slackbot|discordbot|pinterest|skypeuripreview|redditbot|viber|snapchat|vkshare|embedly|iframely)" 1;
}

server {
    listen 80;
    listen [::]:80;   # container içinde localhost önce IPv6'ya çözülür (sağlık kontrolü)
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API adresi derlemede VITE_API_URL'den yazılır (Dockerfile). Değişken olduğu için istek anında çözülür:
    # API kapalıyken de nginx açılır. 127.0.0.11, Docker'ın (Coolify ağının) iç DNS'i.
    set $api_origin "__API_ORIGIN__";
    resolver 127.0.0.11 valid=60s ipv6=off;
    resolver_timeout 3s;

    # Vite'ın adında içerik özeti olan dosyaları hiç değişmez: tarayıcı bir yıl saklasın
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Coolify sağlık kontrolü
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Paneller ve tek kullanımlık bağlantılar aranmasın; sitemap ana alan adında sunulur
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        return 200 "User-agent: *\nDisallow: /panel\nDisallow: /admin\nDisallow: /auth/\nDisallow: /sifremi-unuttum\n\nSitemap: https://$host/sitemap.xml\n";
    }

    # Yayındaki mekanlarla API üretir (SeoController)
    location = /sitemap.xml {
        proxy_pass $api_origin/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location ~ "^/mekan/(?<venue_id>[0-9a-fA-F-]{36})/?$" {
        if ($preview_bot) {
            rewrite ^ /__onizleme/$venue_id last;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Yalnızca yukarıdaki yönlendirmeyle girilir. API'ye ulaşılamazsa ya da mekan yayında değilse bot da
    # normal sayfayı alır.
    location ~ "^/__onizleme/(?<preview_id>[0-9a-fA-F-]{36})$" {
        internal;
        proxy_pass $api_origin/seo/mekan/$preview_id;
        proxy_ssl_server_name on;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }

    # Tek sayfa uygulama: /mekan/..., /panel/... gibi adresler index.html'e düşer.
    # index.html önbelleğe alınmaz ki yeni sürüm yayınlanınca hemen görünsün.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location @spa {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
