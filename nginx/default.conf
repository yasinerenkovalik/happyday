server {
    listen 80;
    listen [::]:80;   # container içinde localhost önce IPv6'ya çözülür (sağlık kontrolü)
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite'ın adında içerik özeti olan dosyaları hiç değişmez: tarayıcı bir yıl saklasın
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Coolify sağlık kontrolü
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Tek sayfa uygulama: /mekan/..., /panel/... gibi adresler index.html'e düşer.
    # index.html önbelleğe alınmaz ki yeni sürüm yayınlanınca hemen görünsün.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
