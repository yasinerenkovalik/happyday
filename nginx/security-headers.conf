# nginx, bir location içinde add_header varsa üst seviyedekileri devralmaz; bu yüzden her location ayrıca ekler.
# Asıl Content-Security-Policy index.html'deki meta etiketinde (vite.config.ts); meta ile verilemeyen frame-ancestors burada.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
